<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unclutter</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Unclutter</span>
    <button id="themeToggle" class="header-icon" aria-label="Toggle light / dark mode" type="button">
      <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
    </button>
  </header>

  <main>
    <div class="title-block">
      <h1>How are you feeling?</h1>
      <p>Select an option to adjust your browsing experience.</p>
    </div>

    <div class="state-grid">
      <button class="state-btn" data-state="overwhelmed">
        <span class="material-symbols-outlined icon icon-sage">water_drop</span>
        <span class="label">I'm overwhelmed</span>
      </button>
      <button class="state-btn" data-state="eyes-hurt">
        <span class="material-symbols-outlined icon icon-slate">visibility_off</span>
        <span class="label">My eyes hurt</span>
      </button>
      <button class="state-btn" data-state="cant-focus">
        <span class="material-symbols-outlined icon icon-sage">center_focus_strong</span>
        <span class="label">I can't focus</span>
      </button>
      <button class="state-btn" data-state="sensory-overload">
        <span class="material-symbols-outlined icon icon-slate">hearing</span>
        <span class="label">Sensory overload</span>
      </button>
    </div>

    <div class="section">
      <h2 class="section-label">Accessibility</h2>
      <div class="option-card">
        <label class="toggle-row">
          <span class="option-text">Dyslexia-friendly font</span>
          <span class="switch">
            <input type="checkbox" id="dyslexiaFont" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2 class="section-label">Read Aloud</h2>
      <div class="reader-card">
        <div class="reader-buttons">
          <button id="readerPlayPause" class="reader-btn" disabled>Play</button>
          <button id="readerStop" class="reader-btn reader-btn-secondary" disabled>Stop</button>
          <label class="speed-control">
            <span>Speed</span>
            <select id="readerSpeed" disabled>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
            </select>
          </label>
        </div>
        <p id="readerStatus" class="reader-status" aria-live="polite">
          Simplify a page to enable controls.
        </p>
      </div>
    </div>

    <button id="resetBtn" class="reset-btn">
      Reset to default
    </button>

    <div id="status" class="status"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
